[project]
name = "qbm"
version = "0.1.2"
authors = [
  {name="Cameron Perot"},
]
description = "A Python package for training and analyzing quantum Boltzmann machines"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
requires-python = ">=3.13"
dependencies = [
    "dwave-ocean-sdk>=4.2.0",
    "matplotlib>=3.4.3",
    "numpy>=1.20.3",
    "pandas>=1.3.3",
    "scipy>=1.7.1",
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "ipython",
    "m2r2",
    "pyright",
    "pytest",
    "pytest-cov",
    "python-language-server",
    "ruff",
    "Sphinx",
    "sphinx-rtd-theme",
    "twine",
]
ipython = [
]

[project.urls]
Homepage = "https://github.com/cameronperot/qbm"
Documentation = "https://cameronperot.github.io/qbm/html/index.html"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["qbm"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # isort
]

[tool.ruff.lint.isort]
known-first-party = ["qbm"]

[tool.uv]
exclude-newer = "30 days"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov --capture=no"
testpaths = [
    "tests",
]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"  # options: "off", "basic", "standard", "strict"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
]
