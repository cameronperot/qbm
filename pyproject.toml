[project]
name = "qbm"
version = "1.0.0"
authors = [
  {name="Cameron Perot"},
]
description = "A Python package for training and analyzing quantum Boltzmann machines"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "dwave-ocean-sdk>=4.2.0",
    "matplotlib>=3.4.3",
    "numpy>=1.20.3",
    "pandas>=1.3.3",
    "scipy>=1.7.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipython>=9.6.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.27.0",
    "mkdocs-include-markdown-plugin>=7.0.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "python-language-server>=0.36.2",
    "ruff>=0.16.4",
    "twine>=6.2.0",
    "ty>=0.0.73",
    "mkdocs-jupyter>=0.26.3",
]

[project.urls]
Homepage = "https://github.com/cameronperot/qbm"
Documentation = "https://cameronperot.github.io/qbm/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
allowed-confusables = ["ρ", "σ"]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern syntax for the requires-python floor)
    "B",   # flake8-bugbear (likely bugs)
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.uv]
exclude-newer = "30 days"
exclude-newer-package = { ty = false, ruff = false }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --strict-markers --strict-config"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/qbm/plotting/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
]
